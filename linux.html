<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Linux Lab — Minona hub</title>
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141414;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: -140px;
      right: -120px;
      width: 440px;
      height: 520px;
      background: radial-gradient(circle, rgba(168, 0, 230, 0.65) 0%, rgba(120, 0, 180, 0.2) 55%, transparent 75%);
      filter: blur(35px);
      pointer-events: none;
      z-index: 0;
    }

    .top-header {
      width: 100%;
      height: 95px;
      background: #000000;
      border-bottom-left-radius: 50% 14px;
      border-bottom-right-radius: 50% 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 18px;
      z-index: 2;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .back-btn {
      color: #fff;
      text-decoration: none;
      background: #222;
      border: 1px solid #333;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .page-title {
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 20px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 14px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Прогресс-бар загрузки */
    .progress-wrap {
      width: 100%;
      background: #222;
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a800e6, #00e676);
      transition: width 0.2s;
    }

    .status-bar {
      font-size: 12px;
      color: #b5b5b5;
      text-align: center;
    }

    #screen_container {
      width: 100%;
      min-height: 320px;
      background: #000;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      overflow-x: auto;
      position: relative;
    }

    #screen_container div {
      white-space: pre;
      font: 13px monospace;
      line-height: 15px;
      color: #00ff66;
    }

    #screen_container canvas {
      display: none;
      max-width: 100%;
    }

    #mobileInput {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-primary {
      background: #a800e6;
      color: #fff;
    }
    .btn-secondary {
      background: #242424;
      color: #fff;
      border: 1px solid #363636;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="index.html" class="back-btn">← Назад</a>
    <div class="page-title">🐧 Linux Lab</div>
    <div style="width: 70px;"></div>
  </header>

  <main class="container">
    <div class="status-bar" id="status">⏳ Инициализация эмулятора...</div>
    <div class="progress-wrap"><div class="progress-fill" id="pBar"></div></div>

    <div id="screen_container" onclick="focusKeyboard()">
      <div></div>
      <canvas></canvas>
    </div>
    <input type="text" id="mobileInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div class="controls-row">
      <button class="btn btn-secondary" onclick="focusKeyboard()">⌨️ Клавиатура</button>
      <button class="btn btn-secondary" onclick="if(window.emulator) emulator.restart()">🔄 Ребут</button>
      <a id="csBtn" href="#" target="_blank" class="btn btn-primary">🚀 Ubuntu (Codespaces)</a>
    </div>
  </main>

  <script>
    document.getElementById("csBtn").href = "https://github.com" + "/codespaces/new";
    const statusEl = document.getElementById("status");
    const pBar = document.getElementById("pBar");

    window.addEventListener("error", (e) => {
      statusEl.textContent = "❌ Ошибка: " + e.message;
    });

    if (typeof V86 === "undefined") {
      statusEl.textContent = "❌ Библиотека v86 не загрузилась (проверь сеть)";
    } else {
      const cdn = "https://unpkg.com";
      const imgBase = "https://copy.sh";

      window.emulator = new V86({
        wasm_path: cdn + "build/v86.wasm",
        memory_size: 64 * 1024 * 1024,
        vga_memory_size: 2 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: { url: cdn + "bios/seabios.bin" },
        vga_bios: { url: cdn + "bios/vgabios.bin" },
        bzimage: { url: imgBase + "buildroot-bzimage.bin" },
        cmdline: "tsc=reliable mitigations=off random.trust_cpu=on",
        autostart: true
      });

      emulator.add_listener("download-progress", function(e) {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          pBar.style.width = pct + "%";
          statusEl.textContent = `📥 Загрузка (${e.file_name || "образа"}): ${pct}%`;
        } else {
          const mb = (e.loaded / 1024 / 1024).toFixed(1);
          statusEl.textContent = `📥 Скачано: ${mb} МБ...`;
        }
      });

      emulator.add_listener("download-error", function(e) {
        statusEl.textContent = "❌ Не удалось скачать файл: " + (e.file_name || "CORS блокировка");
      });

      emulator.add_listener("emulator-ready", function() {
        pBar.style.width = "100%";
        statusEl.textContent = "✅ Linux запущен! Жми «⌨️ Клавиатура» и пиши команды";
      });
    }

    const mobileInput = document.getElementById("mobileInput");
    function focusKeyboard() { mobileInput.focus(); }
    mobileInput.addEventListener("input", (e) => {
      if (e.data && window.emulator) emulator.keyboard_send_text(e.data);
      mobileInput.value = "";
    });
    mobileInput.addEventListener("keydown", (e) => {
      if (!window.emulator) return;
      if (e.key === "Enter") emulator.keyboard_send_scancodes([0x1C, 0x9C]);
      else if (e.key === "Backspace") emulator.keyboard_send_scancodes([0x0E, 0x8E]);
    });
  </script>

</body>
</html>
