<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Linux Lab — Minona hub</title>
  <script src="https://copy.sh"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141414;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: -140px;
      right: -120px;
      width: 440px;
      height: 520px;
      background: radial-gradient(circle, rgba(168, 0, 230, 0.65) 0%, rgba(120, 0, 180, 0.2) 55%, transparent 75%);
      filter: blur(35px);
      pointer-events: none;
      z-index: 0;
    }

    .top-header {
      width: 100%;
      height: 95px;
      background: #000000;
      border-bottom-left-radius: 50% 14px;
      border-bottom-right-radius: 50% 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 18px;
      z-index: 2;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .back-btn {
      color: #fff;
      text-decoration: none;
      background: #222;
      border: 1px solid #333;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .back-btn:active { transform: scale(0.95); }

    .page-title {
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 20px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 14px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Контейнер экрана эмулятора */
    #screen_container {
      width: 100%;
      min-height: 320px;
      background: #000;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      overflow-x: auto;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
    }

    #screen_container div {
      white-space: pre;
      font: 13px monospace;
      line-height: 15px;
      color: #00ff66;
    }

    #screen_container canvas {
      display: none;
      max-width: 100%;
    }

    /* Скрытое поле для вызова клавиатуры на телефоне */
    #mobileInput {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 140px;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-primary {
      background: #a800e6;
      color: #fff;
      box-shadow: 0 4px 15px rgba(168, 0, 230, 0.4);
    }
    .btn-secondary {
      background: #242424;
      color: #fff;
      border: 1px solid #363636;
    }
    .status-bar {
      font-size: 12px;
      color: #a5a5a5;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="index.html" class="back-btn">← Назад</a>
    <div class="page-title">🐧 Linux Lab</div>
    <div style="width: 70px;"></div>
  </header>

  <main class="container">
    <div class="status-bar" id="status">⏳ Загрузка ядра Linux (подожди 3–5 сек)...</div>

    <!-- Экран эмулятора -->
    <div id="screen_container" onclick="focusKeyboard()">
      <div></div>
      <canvas></canvas>
    </div>
    <input type="text" id="mobileInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div class="controls-row">
      <button class="btn btn-secondary" onclick="focusKeyboard()">⌨️ Клавиатура</button>
      <button class="btn btn-secondary" onclick="emulator.restart()">🔄 Ребут</button>
      <a id="csBtn" href="#" target="_blank" class="btn btn-primary">🚀 Ubuntu (Codespaces)</a>
    </div>
  </main>

  <script>
    const base = "https://copy.sh" + "/v86/";
    document.getElementById("csBtn").href = "https://github.com" + "/codespaces/new";

    const emulator = new V86({
      wasm_path: base + "build/v86.wasm",
      memory_size: 64 * 1024 * 1024,
      vga_memory_size: 2 * 1024 * 1024,
      screen_container: document.getElementById("screen_container"),
      bios: { url: base + "bios/seabios.bin" },
      vga_bios: { url: base + "bios/vgabios.bin" },
      bzimage: { url: base + "images/buildroot-bzimage.bin" },
      cmdline: "tsc=reliable mitigations=off random.trust_cpu=on",
      autostart: true
    });

    emulator.add_listener("emulator-ready", function() {
      document.getElementById("status").textContent = "✅ Ядро загружено! Нажми «⌨️ Клавиатура» и вводи команды (например: ls, uname -a, rm -rf /)";
    });

    // Поддержка ввода с экранной клавиатуры телефона
    const mobileInput = document.getElementById("mobileInput");
    function focusKeyboard() {
      mobileInput.focus();
    }
    mobileInput.addEventListener("input", (e) => {
      if (e.data) {
        emulator.keyboard_send_text(e.data);
      }
      mobileInput.value = "";
    });
    mobileInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        emulator.keyboard_send_scancodes([0x1C, 0x9C]);
      } else if (e.key === "Backspace") {
        emulator.keyboard_send_scancodes([0x0E, 0x8E]);
      }
    });
  </script>

</body>
</html>
