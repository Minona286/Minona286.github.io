<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Minona Hub (Classic v1.0)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin: 10px 0 24px; }
    h1 { font-size: 24px; margin-bottom: 6px; }
    p.sub { color: #9e9e9e; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card {
      background: #1e1e1e; border: 1px solid #2c2c2c; border-radius: 16px;
      padding: 18px 14px; text-decoration: none; color: #fff;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card:active { transform: scale(0.97); background: #292929; }
    .icon { font-size: 28px; }
    .title { font-weight: 600; font-size: 16px; }
    .desc { font-size: 12px; color: #a0a0a0; }
    .back-btn {
      display: block; text-align: center; margin-top: 28px; padding: 12px;
      background: #222; color: #bbb; text-decoration: none; border-radius: 12px;
      font-size: 13px; border: 1px solid #333;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Minona Hub</h1>
    <p class="sub">Классическая версия v1.0</p>
  </header>

  <div class="grid">
    <a href="dos.html" class="card">
      <span class="icon">💾</span>
      <span class="title">FreeDOS</span>
      <span class="desc">Эмулятор DOS внутри сайта</span>
    </a>

    <a href="https://copy.sh" class="card">
      <span class="icon">🖥️</span>
      <span class="title">KolibriOS</span>
      <span class="desc">Быстрая ОС на ассемблере</span>
    </a>

    <a href="https://github.com" class="card">
      <span class="icon">🐧</span>
      <span class="title">Linux Desktop</span>
      <span class="desc">Ubuntu в облаке</span>
    </a>

    <a href="tool2.html" class="card">
      <span class="icon">🛠️</span>
      <span class="title">Утилита #2</span>
      <span class="desc">Свободный слот</span>
    </a>
  </div>

  <a href="index.html" class="back-btn">✨ Вернуться в новый дизайн</a>
</body>
</html>
