<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Minona hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #141414;
      --text: #ffffff;
      --subtext: #a5a5a5;
      --card-bg: rgba(34, 34, 34, 0.92);
      --card-border: #2e2e2e;
      --card-active: #2c2c2c;
      --glow: rgba(168, 0, 230, 0.75);
      --glow-mid: rgba(120, 0, 180, 0.25);
    }

    body.light {
      --bg: #f3f0f7;
      --text: #141414;
      --subtext: #555555;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: #ded8e8;
      --card-active: #eae4f2;
      --glow: rgba(185, 40, 245, 0.55);
      --glow-mid: rgba(160, 30, 220, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: -140px;
      right: -120px;
      width: 440px;
      height: 520px;
      background: radial-gradient(circle, var(--glow) 0%, var(--glow-mid) 55%, transparent 75%);
      filter: blur(35px);
      pointer-events: none;
      z-index: 0;
      transition: background 0.3s;
    }

    .top-header {
      position: relative;
      width: 100%;
      height: 135px;
      background: #000000;
      border-bottom-left-radius: 50% 18px;
      border-bottom-right-radius: 50% 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 25px;
      z-index: 2;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .logo-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 24px;
      color: #ffffff;
      transform: rotate(-16deg);
      margin-left: 6px;
      margin-top: 8px;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }
    .theme-toggle:active { transform: scale(0.94); }
    .toggle-knob { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    body:not(.light) .toggle-knob { transform: translateX(0px); }
    body.light .toggle-knob { transform: translateX(-34px); }

    .yt-link { display: inline-block; transition: transform 0.15s; }
    .yt-link:active { transform: scale(0.92); }

    .container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 15px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(6px);
      transition: transform 0.15s, background 0.3s, border-color 0.3s;
    }
    .card:active {
      transform: scale(0.96);
      background: var(--card-active);
    }
    .icon { font-size: 28px; }
    .title { font-weight: 700; font-size: 16px; }
    .desc { font-size: 12px; color: var(--subtext); line-height: 1.35; }

    #installBtn {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #a800e6;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 0, 230, 0.4);
    }

    .old-ver-link {
      display: block;
      text-align: center;
      margin-top: 26px;
      color: var(--subtext);
      font-size: 12px;
      text-decoration: none;
      opacity: 0.75;
    }
    .old-ver-link:hover { opacity: 1; }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="logo-title">Minona hub</div>

    <div class="header-controls">
      <button class="theme-toggle" id="themeBtn" aria-label="Переключить тему">
        <svg width="96" height="72" viewBox="0 0 115 86" fill="none">
          <path d="M22 18L14 10M30 14L27 4M38 16L43 6M16 26L6 24" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
          <g transform="rotate(14 58 38)">
            <rect x="22" y="22" width="72" height="32" rx="16" fill="#fff"/>
            <circle class="toggle-knob" cx="76" cy="38" r="10.5" fill="#000"/>
          </g>
          <path d="M72 64C62 62 58 74 68 78" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
        </svg>
      </button>

      <a href="https://youtube.com/@notatalkingtom" target="_blank" class="yt-link" aria-label="YouTube">
        <svg width="56" height="50" viewBox="0 0 70 62" fill="none">
          <path d="M8 12C15 7 54 6 61 11C67 16 66 46 60 52C54 57 14 56 8 51C3 46 3 17 8 12Z" fill="#E60000" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
          <path d="M28 22L46 31L28 41V22Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="grid">
      <a href="dos.html" class="card">
        <span class="icon">💾</span>
        <span class="title">FreeDOS</span>
        <span class="desc">Эмулятор DOS внутри сайта</span>
      </a>

      <a href="https://copy.sh" class="card">
        <span class="icon">🖥️</span>
        <span class="title">KolibriOS</span>
        <span class="desc">Быстрая ОС на ассемблере</span>
      </a>

      <a href="linux.html" class="card">
        <span class="icon">🐧</span>
        <span class="title">Linux Desktop</span>
        <span class="desc">Ubuntu в облаке</span>
      </a>

      <a href="tool2.html" class="card">
        <span class="icon">🛠️</span>
        <span class="title">Утилита #2</span>
        <span class="desc">Свободный слот</span>
      </a>
    </div>

    <button id="installBtn">📲 Установить Minona hub</button>
    <a href="old.html" class="old-ver-link">🕰️ Переключиться на старый дизайн (v1.0)</a>
  </main>

  <script>
    const themeBtn = document.getElementById('themeBtn');
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
    }
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    let deferredPrompt;
    const btn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = 'block';
    });
    btn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        btn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
