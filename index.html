<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Minona hub</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141414;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    /* Фиолетовое свечение в правом нижнем углу */
    body::after {
      content: "";
      position: fixed;
      bottom: -140px;
      right: -120px;
      width: 440px;
      height: 520px;
      background: radial-gradient(circle, rgba(168, 0, 230, 0.75) 0%, rgba(120, 0, 180, 0.25) 55%, transparent 75%);
      filter: blur(35px);
      pointer-events: none;
      z-index: 0;
    }

    /* Черная волнистая шапка */
    .top-header {
      position: relative;
      width: 100%;
      height: 135px;
      background: #000000;
      border-bottom-left-radius: 50% 18px;
      border-bottom-right-radius: 50% 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 25px;
      z-index: 2;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    /* Повернутый заголовок как на рисунке */
    .logo-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      font-size: 24px;
      color: #ffffff;
      transform: rotate(-16deg);
      margin-left: 6px;
      margin-top: 8px;
      letter-spacing: 0.5px;
      user-select: none;
    }

    /* Дудлы в правом верхнем углу */
    .doodles {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: -5px;
    }
    .yt-link {
      display: inline-block;
      transition: transform 0.15s;
    }
    .yt-link:active {
      transform: scale(0.92);
    }

    /* Основной контейнер с кнопками */
    .container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .card {
      background: rgba(34, 34, 34, 0.92);
      border: 1px solid #2e2e2e;
      border-radius: 18px;
      padding: 18px 15px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(6px);
      transition: transform 0.15s, background 0.15s;
    }
    .card:active {
      transform: scale(0.96);
      background: #2c2c2c;
    }
    .icon { font-size: 28px; }
    .title { font-weight: 700; font-size: 16px; }
    .desc { font-size: 12px; color: #a5a5a5; line-height: 1.35; }

    #installBtn {
      display: none;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #a800e6;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 0, 230, 0.4);
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="logo-title">Minona hub</div>

    <div class="doodles">
      <!-- Белый дудл с лучами -->
      <svg width="88" height="72" viewBox="0 0 110 90" fill="none">
        <!-- Лучи -->
        <path d="M22 18L14 10M30 14L27 4M38 16L43 6M16 26L6 24" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Капсула/глаз -->
        <ellipse cx="56" cy="36" rx="34" ry="15" transform="rotate(14 56 36)" fill="#fff"/>
        <circle cx="75" cy="40" r="8.5" fill="#000"/>
        <!-- Нижний крючок -->
        <path d="M68 62C58 60 54 72 64 76" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
      </svg>

      <!-- Рисованная кнопка YouTube (можешь заменить # на ссылку на свой канал) -->
      <a href="https://youtube.com" target="_blank" class="yt-link" aria-label="YouTube">
        <svg width="58" height="52" viewBox="0 0 70 62" fill="none">
          <path d="M8 12C15 7 54 6 61 11C67 16 66 46 60 52C54 57 14 56 8 51C3 46 3 17 8 12Z" fill="#E60000" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
          <path d="M28 22L46 31L28 41V22Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="grid">
      <a href="dos.html" class="card">
        <span class="icon">💾</span>
        <span class="title">FreeDOS</span>
        <span class="desc">Эмулятор DOS внутри сайта</span>
      </a>

      <a href="https://copy.sh" class="card">
        <span class="icon">🖥️</span>
        <span class="title">KolibriOS</span>
        <span class="desc">Быстрая ОС на ассемблере</span>
      </a>

      <a href="https://github.com" class="card">
        <span class="icon">🐧</span>
        <span class="title">Linux Desktop</span>
        <span class="desc">Ubuntu в облаке</span>
      </a>

      <a href="tool2.html" class="card">
        <span class="icon">🛠️</span>
        <span class="title">Утилита #2</span>
        <span class="desc">Свободный слот</span>
      </a>
    </div>

    <button id="installBtn">📲 Установить Minona hub</button>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    let deferredPrompt;
    const btn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = 'block';
    });
    btn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        btn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
